[project]
name = "intraday"
version = "0.1.0"
description = "Intraday US-equity prediction engine: point-in-time features, walk-forward validation, cost-aware decisions"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "duckdb>=0.10",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intraday*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
